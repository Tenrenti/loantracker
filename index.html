<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loan Tracker</title>
<style>
:root{
  --bg:#f6f8f7; --card:#ffffff; --ink:#14221c; --mute:#6b7b73; --line:#e3e9e6;
  --g:#0f9d6b; --g2:#0b7a53; --gsoft:#e6f6ef; --red:#d6453d; --redsoft:#fdeceb; --amb:#d98a0b; --ambsoft:#fff3dc; --blue:#2b6fd6;
  --sh:0 1px 2px rgba(20,34,28,.06),0 8px 24px rgba(20,34,28,.08); --sh2:0 2px 4px rgba(20,34,28,.08),0 16px 40px rgba(20,34,28,.14);
  --r:18px; --ease:cubic-bezier(.22,.8,.26,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Helvetica Neue",Helvetica,Inter,Arial,sans-serif;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(#dfe7e3 1px,transparent 1px);background-size:22px 22px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 80px}

/* header */
header{position:relative;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border-radius:0 0 28px 28px;
  box-shadow:var(--sh2);overflow:hidden;padding:22px 0 0;margin-bottom:22px}
header .lines{position:absolute;inset:0;pointer-events:none;opacity:.5}
header .lines path{fill:none;stroke:#fff;stroke-width:1.2;stroke-dasharray:6 10;animation:dash 14s linear infinite}
header .lines path:nth-child(2){opacity:.6;animation-duration:22s;animation-direction:reverse}
@keyframes dash{to{stroke-dashoffset:-400}}
.top{display:flex;align-items:center;gap:14px;position:relative}
.logo{width:46px;height:46px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.logo svg{width:26px;height:26px;stroke:var(--g2)}
h1{margin:0;font-size:24px;letter-spacing:-.3px}
.sub{font-size:13px;opacity:.85}
.grow{flex:1}
.hbtn{background:#fff;color:var(--g2);border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15);transition:transform .25s var(--ease),box-shadow .25s}
.hbtn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.22)}
.hbtn.ghost{background:rgba(255,255,255,.18);color:#fff;box-shadow:none}
nav{display:flex;gap:6px;margin-top:20px;position:relative;overflow-x:auto}
nav button{background:transparent;border:0;color:#fff;padding:12px 18px;border-radius:14px 14px 0 0;font-weight:600;cursor:pointer;opacity:.8;display:flex;gap:8px;align-items:center;white-space:nowrap;transition:all .3s var(--ease)}
nav button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:var(--bg);color:var(--g2);opacity:1}
nav button:not(.on):hover{background:rgba(255,255,255,.14);opacity:1}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.card.hov:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.kpi{position:relative;overflow:hidden}
.kpi .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.12);margin-bottom:12px}
.kpi .ic svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kpi .lab{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);font-weight:700}
.kpi .num{font-size:34px;font-weight:800;letter-spacing:-1px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .cap{font-size:12.5px;color:var(--mute);margin-top:2px}
.ic.g{background:linear-gradient(135deg,#18b97f,var(--g2))} .ic.r{background:linear-gradient(135deg,#ef6a62,var(--red))}
.ic.a{background:linear-gradient(135deg,#f1a93a,var(--amb))} .ic.b{background:linear-gradient(135deg,#4f8fe8,var(--blue))}
.kpi.solid{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border-color:transparent}
.kpi.solid .lab,.kpi.solid .cap{color:rgba(255,255,255,.8)}
.kpi.solid .ic{background:#fff}.kpi.solid .ic svg{stroke:var(--g2)}

h2{font-size:15px;margin:26px 2px 12px;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
h2 svg{width:18px;height:18px;stroke:var(--g2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.two{grid-template-columns:1.2fr 1fr}
@media(max-width:820px){.two{grid-template-columns:1fr}}

/* people */
.person{display:flex;gap:14px;align-items:center;cursor:pointer}
.avatar{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:18px;box-shadow:0 4px 10px rgba(0,0,0,.15);flex:none}
.pmain{flex:1;min-width:0}
.pname{font-weight:700;font-size:16px}
.pmeta{font-size:12.5px;color:var(--mute)}
.pamt{text-align:right;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.bar{height:8px;background:#eaf0ed;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#18b97f,var(--g2));border-radius:99px;transition:width 1.1s var(--ease)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px}
.pill.ok{background:var(--gsoft);color:var(--g2)} .pill.late{background:var(--redsoft);color:var(--red)} .pill.soon{background:var(--ambsoft);color:var(--amb)} .pill.plain{background:#eef2f0;color:var(--mute)}

/* loan details */
.loan{padding:0;overflow:hidden}
.lhead{display:flex;gap:12px;align-items:center;padding:16px 18px;cursor:pointer}
.chev{width:20px;height:20px;stroke:var(--mute);fill:none;stroke-width:2.4;transition:transform .4s var(--ease)}
.loan.open .chev{transform:rotate(180deg)}
.lbody{max-height:0;overflow:hidden;transition:max-height .6s var(--ease)}
.lbody-in{padding:0 18px 18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid #f0f4f2;font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
tr.paid td{color:var(--mute)} tr.paid .amt{text-decoration:line-through}
tr.late td:first-child{box-shadow:inset 3px 0 0 transparent}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid #c5d1cb;background:#fff;cursor:pointer;display:grid;place-items:center;transition:all .25s var(--ease);padding:0}
.chk svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:all .3s var(--ease)}
.chk.on{background:var(--g);border-color:var(--g)} .chk.on svg{opacity:1;transform:scale(1)}
.mini{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);transition:all .25s var(--ease)}
.mini:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.mini.red{color:var(--red)}
.solid-btn{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(15,157,107,.35);transition:all .25s var(--ease)}
.solid-btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(15,157,107,.45)}

/* reminders */
.rem{display:flex;gap:12px;align-items:center;padding:13px 16px}
.rem+.rem{margin-top:10px}
.rdate{width:58px;text-align:center;border-radius:12px;padding:6px 0;flex:none;box-shadow:0 3px 8px rgba(0,0,0,.08)}
.rdate b{display:block;font-size:20px;line-height:1}.rdate span{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px}
.rdate.late{background:var(--redsoft);color:var(--red)}.rdate.soon{background:var(--ambsoft);color:var(--amb)}.rdate.later{background:#eef2f0;color:var(--mute)}

/* chart */
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.col .b{width:100%;max-width:46px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#18b97f,var(--g2));height:0;transition:height 1s var(--ease);box-shadow:0 4px 10px rgba(15,157,107,.3)}
.col .v{font-size:10.5px;color:var(--mute);margin-bottom:4px;white-space:nowrap}
.col .m{font-size:11.5px;color:var(--mute);margin-top:6px;font-weight:600}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(14,28,22,.45);display:grid;place-items:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .35s;z-index:50;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:22px;box-shadow:var(--sh2);width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:22px;transform:translateY(24px) scale(.97);transition:transform .45s var(--ease)}
.scrim.on .modal{transform:none}
.modal h3{margin:0 0 14px;font-size:19px}
label{display:block;font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.5px;margin:12px 0 5px;text-transform:uppercase}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;background:#fbfdfc;outline:none;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--g);box-shadow:0 0 0 4px var(--gsoft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{margin-top:14px;background:var(--gsoft);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--g2)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}

/* statement */
.paper{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:28px;max-width:760px;margin:0 auto}
.paper h4{margin:0;font-size:22px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;box-shadow:var(--sh2);opacity:0;transition:all .4s var(--ease);z-index:99;font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.fade{animation:fade .55s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.banner{background:var(--ambsoft);border:1px solid #f1d49a;color:#7a5200;border-radius:14px;padding:10px 14px;font-size:13.5px;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.stack>*+*{margin-top:12px}
@media print{
  body{background:#fff}header,nav,.noprint,.toast{display:none!important}
  .paper{border:0;box-shadow:none;padding:0;max-width:none}
}
</style>
</head>
<body>

<header>
  <svg class="lines" viewBox="0 0 1100 200" preserveAspectRatio="none"><path d="M0 150 C 200 60, 350 200, 550 110 S 900 30, 1100 120"/><path d="M0 100 C 180 180, 380 20, 580 90 S 920 190, 1100 60"/></svg>
  <div class="wrap" style="padding-bottom:0">
    <div class="top">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg></div>
      <div><h1>Loan Tracker</h1><div class="sub" id="sub">Connecting…</div></div>
      <div class="grow"></div>
      <button class="hbtn ghost" id="btnRefresh" title="Refresh">Refresh</button>
      <button class="hbtn ghost" id="btnSettings">Settings</button>
      <button class="hbtn" id="btnAdd">+ Add loan</button>
    </div>
    <nav id="nav"></nav>
  </div>
</header>

<div class="wrap" id="view"></div>

<!-- Add loan -->
<div class="scrim" id="mAdd"><div class="modal">
  <h3>Add a loan</h3>
  <div class="row2">
    <div><label>Borrower</label><input id="fB" list="people" placeholder="e.g. Charlotte"><datalist id="people"></datalist></div>
    <div><label>Label (optional)</label><input id="fL" placeholder="e.g. Loan 5"></div>
  </div>
  <div class="row2">
    <div><label>Amount lent (₱)</label><input id="fP" type="number" min="0" step="0.01" placeholder="25000"></div>
    <div><label>Start date</label><input id="fD" type="date"></div>
  </div>
  <div class="row2">
    <div><label>How is it computed?</label><select id="fM"><option value="int">Interest per month (flat)</option><option value="fix">Fixed amount per installment</option></select></div>
    <div><label>Frequency</label><select id="fF"><option value="m">Monthly</option><option value="s">Twice a month</option><option value="w">Weekly</option></select></div>
  </div>
  <div class="row2">
    <div id="wRate"><label>Interest % per month</label><input id="fR" type="number" min="0" step="0.01" value="2"></div>
    <div id="wFix" style="display:none"><label>Amount per installment (₱)</label><input id="fA" type="number" min="0" step="0.01"></div>
    <div><label>Number of installments</label><input id="fN" type="number" min="1" max="120" value="6"></div>
  </div>
  <label>Notes</label><textarea id="fT" rows="2"></textarea>
  <div class="preview" id="prev">Fill in the details to preview the schedule.</div>
  <div class="actions"><button class="mini" data-close>Cancel</button><button class="solid-btn" id="saveLoan">Save loan</button></div>
</div></div>

<!-- Extra line -->
<div class="scrim" id="mLine"><div class="modal">
  <h3>Add extra charge / installment</h3>
  <div class="row2"><div><label>Due date</label><input id="xD" type="date"></div><div><label>Amount (₱)</label><input id="xA" type="number" step="0.01"></div></div>
  <label>Note</label><input id="xN" placeholder="e.g. extension fee">
  <div class="actions"><button class="mini" data-close>Cancel</button><button class="solid-btn" id="saveLine">Add</button></div>
</div></div>

<!-- Settings -->
<div class="scrim" id="mSet"><div class="modal">
  <h3>Connect to your sheet</h3>
  <div style="font-size:13.5px;color:var(--mute)">Paste the Apps Script web-app link (ends in <b>/exec</b>) and your PIN. They are saved only in this browser — never in the page or on GitHub.</div>
  <label>Web app URL</label><input id="sU" placeholder="https://script.google.com/macros/s/.../exec">
  <label>PIN</label><input id="sP" type="password" placeholder="Your PIN">
  <div class="actions"><button class="mini" id="btnDemo">Try demo data</button><button class="solid-btn" id="saveSet">Connect</button></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* ============ tiny helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso = n => '₱' + Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const peso0 = n => '₱' + Math.round(Number(n||0)).toLocaleString('en-PH');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD = iso => { if(!iso) return '—'; const [y,m,d]=iso.split('-').map(Number); return `${MON[m-1]} ${d}, ${y}`; };
const diffDays = (a,b) => Math.round((Date.parse(a)-Date.parse(b))/864e5);
const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const addDays = (iso,n) => { const d=new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const addMonths = (iso,n) => { const [y,m,d]=iso.split('-').map(Number); const t=new Date(Date.UTC(y,m-1+n,1)); const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate(); t.setUTCDate(Math.min(d,last)); return t.toISOString().slice(0,10); };
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
const COLORS=['#0f9d6b','#2b6fd6','#d98a0b','#8e5bd6','#d6453d','#0e8a9c','#c2528a','#5a7d2a'];
const colorOf = name => { let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))>>>0; return COLORS[h%COLORS.length]; };
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),2600); }
const ICON = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>', list:'<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',
  bell:'<path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/>', file:'<path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  wallet:'<path d="M3 7a2 2 0 012-2h13v4"/><path d="M3 7v11a2 2 0 002 2h15V9H5a2 2 0 01-2-2z"/><circle cx="16.5" cy="14.5" r="1"/>', check:'<path d="M20 6L9 17l-5-5"/>',
  alert:'<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>', users:'<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8"/>'
};
const ic = (k,cls='') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

/* ============ data layer (live Apps Script OR demo) ============ */
let S = { loans:[], inst:[], today:todayISO() };
let mode = 'none';       // 'live' | 'demo' | 'none'
let cfg = { url: store.get('lt_url')||'', pin: store.get('lt_pin')||'' };

async function api(action, data={}){
  if(mode==='demo') return demoApi(action,data);
  const r = await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,pin:cfg.pin,...data})});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error||'Request failed');
  return j;
}
function apply(j){ S.loans=j.loans; S.inst=j.installments; S.today=j.today||todayISO(); render(); }
async function load(){
  if(mode==='none') return;
  try{ $('#sub').textContent='Syncing…'; apply(await api('list')); $('#sub').textContent = mode==='demo' ? 'Demo mode — sample data, nothing is saved' : 'Live — synced with your Google Sheet'; }
  catch(e){ $('#sub').textContent='Not connected'; toast(e.message); if(mode==='live'){ openM('#mSet'); } }
}
async function act(action,data,msg){
  try{ apply(await api(action,data)); if(msg) toast(msg); }catch(e){ toast('Error: '+e.message); }
}

/* demo data (made-up names) */
let D=null;
function demoSeed(){
  const t=todayISO(); const id=()=>Math.random().toString(36).slice(2,10);
  const loans=[],inst=[];
  const mk=(b,label,principal,n,rate,startOff,paidCount)=>{
    const lid=id(); const per=(principal*(1+rate/100*n))/n; const start=addMonths(t,startOff);
    loans.push({id:lid,borrower:b,label,principal,total:per*n,startDate:start,notes:'',source:'demo'});
    for(let i=0;i<n;i++){ const due=addMonths(start,i); const p=i<paidCount;
      inst.push({id:id(),loanId:lid,dueDate:due,amount:+per.toFixed(2),paid:p,paidDate:p?due:'',paidAmount:p?+per.toFixed(2):'',note:''}); }
  };
  mk('Juan Dela Cruz','Business capital',25000,6,2,-4,3);
  mk('Maria Santos','Emergency loan',12000,4,0,-3,2);
  mk('Pedro Reyes','Gadget on installment',30000,10,1.5,-2,2);
  mk('Maria Santos','Tuition',8000,3,0,-1,1);
  mk('Ana Lopez','Pautang',50000,8,2,-1,1);
  D={loans,inst};
}
function demoApi(action,d){
  if(!D) demoSeed();
  const id=()=>Math.random().toString(36).slice(2,10);
  if(action==='addLoan'){ const lid=id(); D.loans.push({id:lid,...d.loan,source:'demo'}); d.installments.forEach(x=>D.inst.push({id:id(),loanId:lid,dueDate:x.dueDate,amount:+x.amount,paid:false,paidDate:'',paidAmount:'',note:x.note||''})); }
  if(action==='setPaid'){ const i=D.inst.find(x=>x.id===d.id); i.paid=d.paid; i.paidDate=d.paid?(d.date||todayISO()):''; i.paidAmount=d.paid?i.amount:''; }
  if(action==='addInstallment') D.inst.push({id:id(),loanId:d.loanId,dueDate:d.dueDate,amount:+d.amount,paid:false,paidDate:'',paidAmount:'',note:d.note||''});
  if(action==='deleteInstallment') D.inst=D.inst.filter(x=>x.id!==d.id);
  if(action==='renameBorrower') D.loans.forEach(l=>{ if(l.borrower===d.from) l.borrower=d.to; });
  if(action==='deleteLoan'){ D.loans=D.loans.filter(l=>l.id!==d.id); D.inst=D.inst.filter(x=>x.loanId!==d.id); }
  return Promise.resolve({ok:true,loans:JSON.parse(JSON.stringify(D.loans)),installments:JSON.parse(JSON.stringify(D.inst)),today:todayISO()});
}

/* ============ calculations ============ */
function loanStats(l){
  const items=S.inst.filter(i=>i.loanId===l.id).sort((a,b)=>a.dueDate<b.dueDate?-1:1);
  const total=items.reduce((s,i)=>s+i.amount,0);
  const paid=items.filter(i=>i.paid).reduce((s,i)=>s+(i.paidAmount||i.amount),0);
  const od=items.filter(i=>!i.paid&&i.dueDate<S.today);
  const next=items.find(i=>!i.paid);
  return {items,total,paid,left:Math.max(0,total-paid),overdue:od.reduce((s,i)=>s+i.amount,0),odCount:od.length,next,pct:total?Math.min(100,paid/total*100):0,done:!next};
}
function people(){
  const m={};
  S.loans.forEach(l=>{ const p=m[l.borrower]=m[l.borrower]||{name:l.borrower,loans:[],total:0,paid:0,left:0,overdue:0,odCount:0,next:null};
    const s=loanStats(l); p.loans.push({l,s}); p.total+=s.total; p.paid+=s.paid; p.left+=s.left; p.overdue+=s.overdue; p.odCount+=s.odCount;
    if(s.next&&(!p.next||s.next.dueDate<p.next.dueDate)) p.next=s.next; });
  return Object.values(m).sort((a,b)=>b.left-a.left);
}
function totals(){ const P=people(); return { left:P.reduce((s,p)=>s+p.left,0), paid:P.reduce((s,p)=>s+p.paid,0), total:P.reduce((s,p)=>s+p.total,0), overdue:P.reduce((s,p)=>s+p.overdue,0), odCount:P.reduce((s,p)=>s+p.odCount,0),
  week:S.inst.filter(i=>!i.paid&&i.dueDate>=S.today&&diffDays(i.dueDate,S.today)<=7).reduce((s,i)=>s+i.amount,0) }; }
function status(i){ if(i.paid) return ['ok','Paid']; const d=diffDays(i.dueDate,S.today); if(d<0) return ['late',`${-d}d late`]; if(d===0) return ['soon','Due today']; if(d<=7) return ['soon',`In ${d}d`]; return ['plain',`In ${d}d`]; }

/* ============ views ============ */
let tab='dash', openLoans=new Set(), stmtPerson=null;
const TABS=[['dash','Dashboard','home'],['loans','Loans','list'],['rem','Reminders','bell'],['stmt','Statements','file']];
function renderNav(){ $('#nav').innerHTML=TABS.map(([k,n,i])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${ic(i)}${n}</button>`).join(''); }

function render(){
  renderNav();
  $('#people').innerHTML=[...new Set(S.loans.map(l=>l.borrower))].map(b=>`<option value="${esc(b)}">`).join('');
  const v=$('#view');
  if(mode==='none'){ v.innerHTML=welcome(); return; }
  v.innerHTML=`<div class="fade">${({dash:vDash,loans:vLoans,rem:vRem,stmt:vStmt})[tab]()}</div>`;
  requestAnimationFrame(()=>{
    document.querySelectorAll('.bar i').forEach(b=>b.style.width=b.dataset.w+'%');
    document.querySelectorAll('.col .b').forEach(b=>b.style.height=b.dataset.h+'%');
    document.querySelectorAll('[data-count]').forEach(countUp);
    document.querySelectorAll('.loan.open .lbody').forEach(b=>b.style.maxHeight=b.scrollHeight+'px');
  });
}
function countUp(el){ const to=+el.dataset.count, t0=performance.now(), dur=900; const f=n=>{ const p=Math.min(1,(n-t0)/dur), e=1-Math.pow(1-p,3); el.textContent=peso0(to*e); if(p<1) requestAnimationFrame(f); }; requestAnimationFrame(f); }
function welcome(){ return `<div class="card empty fade"><div style="font-size:42px">💸</div><h2 style="justify-content:center;font-size:20px">Welcome to Loan Tracker</h2><p>Connect your Google Sheet to see your real loans, or peek around with sample data first.</p><button class="solid-btn" onclick="openM('#mSet')">Connect sheet</button></div>`; }

function vDash(){
  const T=totals(), P=people();
  const kp=(cls,icn,lab,val,cap,solid)=>`<div class="card kpi hov ${solid?'solid':''}"><div class="ic ${cls}">${ic(icn)}</div><div class="lab">${lab}</div><div class="num" data-count="${val}">${peso0(val)}</div><div class="cap">${cap}</div></div>`;
  // upcoming by month chart
  const byM={}; S.inst.filter(i=>!i.paid).forEach(i=>{ const k=i.dueDate.slice(0,7); byM[k]=(byM[k]||0)+i.amount; });
  const ks=Object.keys(byM).sort().slice(0,8), mx=Math.max(1,...ks.map(k=>byM[k]));
  const chart=ks.length?`<div class="chart">${ks.map(k=>`<div class="col"><div class="v">${peso0(byM[k])}</div><div class="b" data-h="${Math.max(4,byM[k]/mx*80)}"></div><div class="m">${MON[+k.slice(5)-1]} ${k.slice(2,4)}</div></div>`).join('')}</div>`:'<div class="empty">Nothing upcoming 🎉</div>';
  return `<div class="grid kpis">
    ${kp('g','wallet','Still to collect',T.left,`of ${peso0(T.total)} total`,true)}
    ${kp('b','check','Collected so far',T.paid,`${T.total?Math.round(T.paid/T.total*100):0}% of everything lent`)}
    ${kp('r','alert','Overdue',T.overdue,`${T.odCount} late installment${T.odCount===1?'':'s'}`)}
    ${kp('a','clock','Due in 7 days',T.week,'Coming up this week')}
  </div>
  <div class="grid two" style="margin-top:6px">
    <div><h2>${ic('users')} Who owes you</h2><div class="stack">${P.length?P.map(personCard).join(''):'<div class="card empty">No loans yet — tap “+ Add loan”.</div>'}</div></div>
    <div><h2>${ic('chart')} Money coming in, by month</h2><div class="card">${chart}</div>
      <h2>${ic('bell')} Next up</h2><div class="stack">${nextUp()}</div></div>
  </div>`;
}
function personCard(p){
  const pill = p.odCount?`<span class="pill late">${p.odCount} late</span>`:(p.left?'<span class="pill ok">On track</span>':'<span class="pill ok">Fully paid</span>');
  return `<div class="card hov person" data-person="${esc(p.name)}"><div class="avatar" style="background:${colorOf(p.name)}">${esc(p.name[0]||'?').toUpperCase()}</div>
   <div class="pmain"><div class="pname">${esc(p.name)} ${pill}</div><div class="pmeta">${p.loans.length} loan${p.loans.length>1?'s':''} · next ${p.next?fmtD(p.next.dueDate):'—'}</div>
   <div class="bar"><i data-w="${p.total?p.paid/p.total*100:0}"></i></div></div>
   <div><div class="pamt">${peso0(p.left)}</div><div class="pmeta" style="text-align:right">left</div></div></div>`;
}
function nextUp(){
  const L=S.inst.filter(i=>!i.paid).sort((a,b)=>a.dueDate<b.dueDate?-1:1).slice(0,4);
  return L.length?L.map(remRow).join(''):'<div class="card empty">All caught up.</div>';
}
function remRow(i){
  const l=S.loans.find(x=>x.id===i.loanId)||{borrower:'?',label:''}; const [k,txt]=status(i); const d=i.dueDate.split('-');
  const cls=k==='late'?'late':(k==='soon'?'soon':'later');
  return `<div class="card rem hov"><div class="rdate ${cls}"><b>${+d[2]}</b><span>${MON[+d[1]-1]}</span></div>
    <div class="pmain"><div class="pname">${esc(l.borrower)}</div><div class="pmeta">${esc(l.label)}${i.note?' · '+esc(i.note):''} · <span class="pill ${k}">${txt}</span></div></div>
    <div class="pamt">${peso0(i.amount)}</div><button class="chk" data-pay="${i.id}" title="Mark paid">${ic('check')}</button></div>`;
}

function vLoans(){
  const P=people(); if(!P.length) return '<div class="card empty">No loans yet — tap “+ Add loan”.</div>';
  return P.map(p=>`<h2><span class="avatar" style="width:28px;height:28px;border-radius:9px;font-size:13px;background:${colorOf(p.name)}">${esc(p.name[0]).toUpperCase()}</span>${esc(p.name)}
      <button class="mini" style="margin-left:auto" data-rename="${esc(p.name)}">Rename</button></h2>
    <div class="stack">${p.loans.map(({l,s})=>loanCard(l,s)).join('')}</div>`).join('');
}
function loanCard(l,s){
  const open=openLoans.has(l.id);
  const pill=s.done?'<span class="pill ok">Paid off</span>':(s.odCount?`<span class="pill late">${s.odCount} late</span>`:'<span class="pill ok">On track</span>');
  return `<div class="card loan ${open?'open':''}" data-loan="${l.id}">
    <div class="lhead" data-toggle="${l.id}"><div class="pmain"><div class="pname">${esc(l.label||'Loan')} ${pill}</div>
      <div class="pmeta">${l.principal?'Lent '+peso0(l.principal)+' · ':''}Total ${peso0(s.total)} · started ${fmtD(l.startDate)}</div>
      <div class="bar"><i data-w="${s.pct}"></i></div></div>
      <div><div class="pamt">${peso0(s.left)}</div><div class="pmeta" style="text-align:right">left</div></div>
      <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
    <div class="lbody"><div class="lbody-in">
      <table><tr><th></th><th>Due</th><th class="r">Amount</th><th>Status</th><th>Paid on</th><th></th></tr>
      ${s.items.map(i=>{const [k,t]=status(i);return `<tr class="${i.paid?'paid':''}"><td style="width:34px"><button class="chk ${i.paid?'on':''}" data-pay="${i.id}" data-paid="${i.paid?1:0}">${ic('check')}</button></td>
        <td>${fmtD(i.dueDate)}${i.note?`<div class="pmeta">${esc(i.note)}</div>`:''}</td><td class="r amt">${peso(i.amount)}</td><td><span class="pill ${k}">${t}</span></td><td>${fmtD(i.paidDate)}</td>
        <td class="r"><button class="mini red" data-delinst="${i.id}" title="Delete line">✕</button></td></tr>`}).join('')}</table>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="mini" data-addline="${l.id}">+ Extra line</button>
        <button class="mini" data-stmt="${esc(l.borrower)}">Statement</button><span class="grow"></span><button class="mini red" data-delloan="${l.id}">Delete loan</button></div>
    </div></div></div>`;
}

function vRem(){
  const open=S.inst.filter(i=>!i.paid).sort((a,b)=>a.dueDate<b.dueDate?-1:1);
  const late=open.filter(i=>i.dueDate<S.today), week=open.filter(i=>i.dueDate>=S.today&&diffDays(i.dueDate,S.today)<=7), later=open.filter(i=>diffDays(i.dueDate,S.today)>7).slice(0,15);
  const sec=(t,ic_,arr,empty)=>`<h2>${ic(ic_)} ${t} <span class="pill plain">${arr.length}</span></h2>${arr.length?arr.map(remRow).join(''):`<div class="card empty">${empty}</div>`}`;
  return sec('Overdue','alert',late,'Nothing overdue. 🎉')+sec('Due in the next 7 days','clock',week,'Nothing this week.')+sec('Later','bell',later,'No future installments.');
}

function vStmt(){
  const P=people(); if(!P.length) return '<div class="card empty">No loans yet.</div>';
  if(!stmtPerson||!P.find(p=>p.name===stmtPerson)) stmtPerson=P[0].name;
  const p=P.find(x=>x.name===stmtPerson);
  const upcoming=S.inst.filter(i=>!i.paid&&p.loans.some(x=>x.l.id===i.loanId)).sort((a,b)=>a.dueDate<b.dueDate?-1:1);
  return `<div class="noprint" style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap"><select id="stSel" style="max-width:280px">${P.map(x=>`<option ${x.name===stmtPerson?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
    <button class="solid-btn" onclick="window.print()">Print / Save PDF</button><button class="mini" id="copyStmt">Copy text for Messenger</button></div>
    <div class="paper"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap"><div><div class="pmeta" style="letter-spacing:1px;text-transform:uppercase;font-weight:700">Statement of account</div><h4>${esc(p.name)}</h4><div class="pmeta">As of ${fmtD(S.today)}</div></div>
      <div style="text-align:right"><div class="pmeta">Balance due</div><div style="font-size:30px;font-weight:800;color:var(--g2)">${peso(p.left)}</div>${p.overdue?`<div class="pill late">${peso(p.overdue)} overdue</div>`:''}</div></div>
    <div class="grid" style="grid-template-columns:repeat(3,1fr);margin:20px 0"><div class="card"><div class="lab pmeta">TOTAL</div><b style="font-size:18px">${peso(p.total)}</b></div><div class="card"><div class="lab pmeta">PAID</div><b style="font-size:18px">${peso(p.paid)}</b></div><div class="card"><div class="lab pmeta">LEFT</div><b style="font-size:18px">${peso(p.left)}</b></div></div>
    <h2 style="margin-top:6px">Upcoming payments</h2>
    <table><tr><th>Due</th><th>For</th><th class="r">Amount</th><th>Status</th></tr>${upcoming.map(i=>{const l=S.loans.find(x=>x.id===i.loanId);const[k,t]=status(i);return `<tr><td>${fmtD(i.dueDate)}</td><td>${esc(l.label||'Loan')}${i.note?' — '+esc(i.note):''}</td><td class="r">${peso(i.amount)}</td><td><span class="pill ${k}">${t}</span></td></tr>`}).join('')||'<tr><td colspan="4" class="empty">Fully paid. Thank you!</td></tr>'}</table>
    <h2>Payments received</h2>
    <table><tr><th>Paid on</th><th>For</th><th class="r">Amount</th></tr>${S.inst.filter(i=>i.paid&&p.loans.some(x=>x.l.id===i.loanId)).sort((a,b)=>a.paidDate<b.paidDate?1:-1).map(i=>{const l=S.loans.find(x=>x.id===i.loanId);return `<tr><td>${fmtD(i.paidDate||i.dueDate)}</td><td>${esc(l.label||'Loan')}</td><td class="r">${peso(i.paidAmount||i.amount)}</td></tr>`}).join('')||'<tr><td colspan="3" class="empty">No payments yet.</td></tr>'}</table></div>`;
}
function stmtText(name){
  const p=people().find(x=>x.name===name); if(!p) return '';
  const up=S.inst.filter(i=>!i.paid&&p.loans.some(x=>x.l.id===i.loanId)).sort((a,b)=>a.dueDate<b.dueDate?-1:1);
  return `Hi ${name}, here is your statement as of ${fmtD(S.today)}:\nTotal: ${peso(p.total)}\nPaid: ${peso(p.paid)}\nBalance: ${peso(p.left)}${p.overdue?`\nOverdue: ${peso(p.overdue)}`:''}\n\nUpcoming:\n`+(up.slice(0,10).map(i=>`• ${fmtD(i.dueDate)} — ${peso(i.amount)}`).join('\n')||'• None, fully paid. Salamat!');
}

/* ============ modals & events ============ */
function openM(s){ document.querySelector(s).classList.add('on'); }
function closeM(){ document.querySelectorAll('.scrim').forEach(m=>m.classList.remove('on')); }
let lineFor=null;

document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-person],[data-toggle]'); if(!t) { if(e.target.classList.contains('scrim')) closeM(); return; }
  const D_=t.dataset;
  if(t.dataset.close!==undefined) return closeM();
  if(D_.tab){ tab=D_.tab; return render(); }
  if(D_.person){ tab='stmt'; stmtPerson=D_.person; return render(); }
  if(D_.stmt){ tab='stmt'; stmtPerson=D_.stmt; window.scrollTo({top:0,behavior:'smooth'}); return render(); }
  if(D_.toggle){ const c=t.closest('.loan'),b=c.querySelector('.lbody'); if(openLoans.has(D_.toggle)){openLoans.delete(D_.toggle);c.classList.remove('open');b.style.maxHeight=0;} else {openLoans.add(D_.toggle);c.classList.add('open');b.style.maxHeight=b.scrollHeight+'px';} return; }
  if(D_.pay){ const on=D_.paid==='1'; return act('setPaid',{id:D_.pay,paid:!on,date:todayISO()},on?'Marked unpaid':'Payment recorded ✓'); }
  if(D_.delinst){ if(confirm('Delete this installment line?')) act('deleteInstallment',{id:D_.delinst},'Line deleted'); return; }
  if(D_.delloan){ if(confirm('Delete this whole loan and its schedule? This cannot be undone.')) act('deleteLoan',{id:D_.delloan},'Loan deleted'); return; }
  if(D_.addline){ lineFor=D_.addline; $('#xD').value=S.today; $('#xA').value=''; $('#xN').value=''; return openM('#mLine'); }
  if(D_.rename){ const to=prompt('Rename borrower:',D_.rename); if(to&&to.trim()&&to!==D_.rename) act('renameBorrower',{from:D_.rename,to:to.trim()},'Renamed'); return; }
  switch(t.id){
    case 'btnAdd': if(mode==='none') return openM('#mSet'); $('#fD').value=todayISO(); prevCalc(); return openM('#mAdd');
    case 'btnSettings': $('#sU').value=cfg.url; $('#sP').value=cfg.pin; return openM('#mSet');
    case 'btnRefresh': return load();
    case 'btnDemo': mode='demo'; D=null; closeM(); return load();
    case 'saveSet': { const u=$('#sU').value.trim(), p=$('#sP').value; if(!u||!p) return toast('Enter the URL and PIN'); cfg={url:u,pin:p}; store.set('lt_url',u); store.set('lt_pin',p); mode='live'; closeM(); return load(); }
    case 'saveLoan': return saveLoan();
    case 'saveLine': { const a=+$('#xA').value; if(!a||!$('#xD').value) return toast('Fill date and amount'); closeM(); return act('addInstallment',{loanId:lineFor,dueDate:$('#xD').value,amount:a,note:$('#xN').value},'Line added'); }
    case 'copyStmt': { const txt=stmtText(stmtPerson); try{ await navigator.clipboard.writeText(txt); toast('Copied — paste it in Messenger'); }catch(err){ prompt('Copy this:',txt); } return; }
  }
});
document.addEventListener('change',e=>{ if(e.target.id==='stSel'){ stmtPerson=e.target.value; render(); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeM(); });

/* add-loan form */
function schedule(){
  const P=+$('#fP').value, n=Math.max(1,Math.min(120,+$('#fN').value||1)), start=$('#fD').value, f=$('#fF').value, m=$('#fM').value;
  if(!start||!n) return null;
  let per; if(m==='int'){ if(!P) return null; const r=(+$('#fR').value||0)/100; per=P*(1+r*n)/n; } else { per=+$('#fA').value; if(!per) return null; }
  const out=[]; for(let i=0;i<n;i++){ const due=f==='m'?addMonths(start,i):f==='w'?addDays(start,7*i):(i%2===0?addMonths(start,i/2):addDays(addMonths(start,(i-1)/2),15)); out.push({dueDate:due,amount:+per.toFixed(2)}); }
  return out;
}
function prevCalc(){
  const s=schedule(), el=$('#prev'); $('#wRate').style.display=$('#fM').value==='int'?'':'none'; $('#wFix').style.display=$('#fM').value==='fix'?'':'none';
  if(!s){ el.textContent='Fill in the details to preview the schedule.'; return; }
  const tot=s.reduce((a,x)=>a+x.amount,0); const P=+$('#fP').value;
  el.innerHTML=`<b>${s.length} × ${peso(s[0].amount)}</b> = <b>${peso(tot)}</b>${P?` · profit ${peso(tot-P)}`:''}<br>First ${fmtD(s[0].dueDate)} → last ${fmtD(s[s.length-1].dueDate)}`;
}
['fP','fD','fM','fF','fR','fA','fN'].forEach(id=>document.addEventListener('input',e=>{ if(e.target.id===id) prevCalc(); }));
function saveLoan(){
  const b=$('#fB').value.trim(); const s=schedule(); if(!b) return toast('Who is the borrower?'); if(!s) return toast('Complete the amounts and date');
  const tot=s.reduce((a,x)=>a+x.amount,0);
  closeM();
  ['fB','fL','fP','fA','fT'].forEach(i=>$('#'+i).value='');
  act('addLoan',{loan:{borrower:b,label:$('#fL').value.trim(),principal:+$('#fP').value||0,total:+tot.toFixed(2),startDate:$('#fD').value,notes:$('#fT').value},installments:s},'Loan added ✓');
}

/* start */
(function init(){
  if(cfg.url&&cfg.pin) mode='live';
  const q=new URLSearchParams(location.search); if(q.get('demo')==='1') mode='demo';
  render(); if(mode!=='none') load(); else $('#sub').textContent='Not connected';
})();
</script>
